<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pi - Side Panel</title>
  <style>
    :root {
      --bg: #1a1b1e;
      --bg-secondary: #25262b;
      --bg-tertiary: #2c2e33;
      --fg: #e4e5e7;
      --fg-secondary: #909296;
      --accent: #d4d4d8;
      --accent-hover: #f4f4f5;
      --border: #373a40;
      --user-msg-bg: #3b3d44;
      --user-msg-fg: #e4e5e7;
      --assistant-msg-bg: #25262b;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
      font-variant-numeric: tabular-nums;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      letter-spacing: -0.01em;
    }

    /* ─── Header ──────────────────────────────────────────────── */
    .header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-tertiary);
      flex-shrink: 0;
    }
    .logo {
      font-size: 15px; font-weight: 500;
      color: var(--fg-secondary);
      flex-shrink: 0;
    }
    .header-title { font-weight: 500; font-size: 13px; flex: 1; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
    .header-actions { display: flex; gap: 2px; }
    .icon-btn {
      width: 28px; height: 28px; border: 1px solid transparent;
      background: transparent;
      border-radius: 4px; cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.1s; color: var(--fg-secondary);
    }
    .icon-btn:hover { background: var(--bg-secondary); border-color: var(--border); color: var(--fg); }

    /* ─── Page Context Bar ────────────────────────────────────── */
    .page-context {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      font-size: 11px; color: var(--fg-secondary);
      flex-shrink: 0;
      white-space: nowrap; overflow: hidden;
    }
    .page-context .url { overflow: hidden; text-overflow: ellipsis; }

    /* ─── Messages ────────────────────────────────────────────── */
    .messages {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .messages:empty::after {
      content: "Ask me about this page";
      display: block; text-align: center; color: var(--fg-secondary);
      padding: 40px 20px; font-size: 12px;
    }

    .msg {
      max-width: 90%; padding: 8px 12px;
      border-radius: var(--radius);
      word-wrap: break-word;
      font-size: 13px;
      line-height: 1.6;
      animation: fadeIn 0.15s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .msg.user {
      align-self: flex-end;
      background: var(--user-msg-bg);
      color: var(--user-msg-fg);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant-msg-bg);
      border: 1px solid var(--border);
    }
    .msg.assistant.streaming {
      border-color: var(--fg-secondary);
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--fg-secondary);
      font-size: 12px; text-align: center;
      max-width: 100%;
    }
    .msg.tool {
      align-self: center;
      color: var(--fg-secondary);
      font-size: 11px;
      font-style: italic;
      max-width: 100%;
    }

    .msg code {
      background: var(--bg-tertiary); padding: 1px 5px; border-radius: 3px;
      font-size: 12px; font-family: inherit;
    }
    .msg pre {
      background: #111; color: #ccc;
      padding: 10px; border-radius: 6px;
      overflow-x: auto; font-size: 12px; margin: 6px 0;
      border: 1px solid var(--border);
    }
    .msg pre code { background: transparent; padding: 0; color: inherit; }
    .msg strong { font-weight: 600; }
    .msg ul, .msg ol { padding-left: 18px; margin: 4px 0; }

    .typing-indicator {
      align-self: flex-start;
      display: flex; gap: 3px;
      padding: 8px 12px;
      background: var(--assistant-msg-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .typing-indicator span {
      width: 6px; height: 6px; background: var(--fg-secondary);
      border-radius: 50%; animation: bounce 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100% { transform: scale(0.6); } 40% { transform: scale(1); } }

    /* ─── Input Area ──────────────────────────────────────────── */
    .input-area {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg-tertiary);
      flex-shrink: 0;
    }
    .input-row {
      display: flex; gap: 6px; align-items: center;
    }
    .input-wrapper {
      flex: 1; position: relative;
    }
    textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; font-family: inherit;
      resize: none; outline: none; background: var(--bg);
      color: var(--fg); line-height: 1.5; min-height: 34px; max-height: 120px;
      transition: border-color 0.1s;
    }
    textarea:focus { border-color: var(--fg-secondary); }
    textarea::placeholder { color: var(--fg-secondary); }

    .send-btn {
      width: 34px; height: 34px; border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg); color: var(--fg-secondary); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.1s; flex-shrink: 0;
    }
    .send-btn:hover { background: var(--bg-secondary); color: var(--fg); }
    .send-btn:disabled { opacity: 0.35; cursor: default; }

    .input-hint {
      font-size: 10px; color: var(--fg-secondary); margin-top: 4px;
      opacity: 0.6;
    }

    /* ─── Connection Banner ───────────────────────────────────── */
    .conn-banner {
      padding: 4px 14px; font-size: 11px;
      flex-shrink: 0; cursor: pointer;
      transition: background 0.1s;
      font-family: inherit;
    }
    .conn-banner.disconnected { background: #2b1d1d; color: #f87171; }
    .conn-banner.connected { background: #1a2b1d; color: #6ee7b7; }
    .conn-banner.processing { background: #1d2b1d; color: #a3e635; }

    /* ─── Full Markdown styles (applied after streaming finishes) ── */
    .msg h1, .msg h2, .msg h3, .msg h4 { margin: 8px 0 4px; font-weight: 600; }
    .msg h1 { font-size: 15px; }
    .msg h2 { font-size: 14px; }
    .msg h3, .msg h4 { font-size: 13px; }
    .msg p { margin: 4px 0; }
    .msg ul, .msg ol { padding-left: 18px; margin: 4px 0; }
    .msg li { margin: 2px 0; }
    .msg blockquote {
      border-left: 3px solid var(--border);
      padding-left: 10px;
      margin: 6px 0;
      color: var(--fg-secondary);
    }
    .msg table { border-collapse: collapse; margin: 6px 0; font-size: 12px; width: 100%; }
    .msg th, .msg td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
    .msg th { background: var(--bg-tertiary); font-weight: 600; }
    .msg a { color: var(--accent); text-decoration: underline; }
    .msg hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">π</div>
    <div class="header-title">pi Companion</div>
    <div class="header-actions">
      <button class="icon-btn" id="btnStop" title="Stop generation" style="display:none">⏹</button>
      <button class="icon-btn" id="btnSummarize" title="Summarize this page">📄</button>
      <button class="icon-btn" id="btnDarkMode" title="Toggle dark mode">🌙</button>
      <button class="icon-btn" id="btnClear" title="Clear chat">🗑️</button>
      <button class="icon-btn" id="btnSettings" title="Settings">⚙️</button>
    </div>
  </div>

  <!-- Connection Banner -->
  <div class="conn-banner disconnected" id="connBanner">
    🔌 Connecting to bridge service…
  </div>

  <!-- Page Context -->
  <div class="page-context" id="pageContext">
    <span>📍</span>
    <span class="url" id="pageUrl">No page loaded</span>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages"></div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <div class="input-wrapper">
        <textarea id="chatInput" placeholder="Ask about this page…" rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" disabled>↑</button>
    </div>
    <div class="input-hint">Enter to send · Shift+Enter for new line</div>
  </div>

  <script type="module">
    import { marked } from "marked";

    // ─── DOM ──────────────────────────────────────────────────────
    const messagesEl = document.getElementById("messages");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const connBanner = document.getElementById("connBanner");
    const pageUrl = document.getElementById("pageUrl");
    const btnClear = document.getElementById("btnClear");
    const btnSettings = document.getElementById("btnSettings");
    const btnSummarize = document.getElementById("btnSummarize");
    const btnDarkMode = document.getElementById("btnDarkMode");
    const btnStop = document.getElementById("btnStop");

    // ─── State ───────────────────────────────────────────────────
    let messages = [];
    let connected = false;
    let isProcessing = false;
    let autoScrolling = true;

    // ─── Connect to background ────────────────────────────────────
    let port = null;

    function connectState() {
      if (port) {
        try { port.disconnect(); } catch {}
      }
      try {
        port = chrome.runtime.connect({ name: "state" });
        port.onMessage.addListener((msg) => {
          if (msg.type === "state") {
            updateFromState(msg.state);
          }
        });
        port.onDisconnect.addListener(() => {
          port = null;
          // Reconnect after a short delay
          setTimeout(connectState, 500);
        });
      } catch (err) {
        console.error("[sidepanel] Failed to connect:", err);
        setTimeout(connectState, 2000);
      }
    }

    connectState();

    // ─── Add a summarize loading state ────────────────────────────
    let summarizeTimeout = null;

    function clearSummarizeTimeout() {
      if (summarizeTimeout) {
        clearTimeout(summarizeTimeout);
        summarizeTimeout = null;
      }
    }

    function showSummarizing() {
      connBanner.className = "conn-banner processing";
      connBanner.textContent = "⏳ Summarizing…";
      clearSummarizeTimeout();
      // 30s safety net (tools + AI generation can take a while)
      summarizeTimeout = setTimeout(() => {
        connBanner.className = "conn-banner disconnected";
        connBanner.textContent = "⏱️ Summarize timed out — check bridge";
      }, 30000);
    }

    function updateFromState(state) {
      const wasConnected = connected;
      connected = state.connected;
      isProcessing = state.isProcessing;
      messages = state.messages || [];

      // Connection banner — with grace period to avoid flash on reconnect
      if (isProcessing) {
        clearSummarizeTimeout();
        connBanner.className = "conn-banner processing";
        connBanner.textContent = "⏳ pi is thinking…";
        btnStop.style.display = "";
      } else if (connected) {
        connBanner.className = "conn-banner connected";
        connBanner.textContent = `🟢 Bridge connected${state.bridgeVersion ? ` v` + state.bridgeVersion : ""}`;
        btnStop.style.display = "none";
      } else if (wasConnected && !state.connected) {
        // Was connected, now disconnected — keep showing connected briefly
        connBanner.className = "conn-banner connected";
        connBanner.textContent = "🔄 Reconnecting…";
      } else {
        connBanner.className = "conn-banner disconnected";
        connBanner.textContent = "🔴 Bridge disconnected — click to reconnect";
        btnStop.style.display = "none";
      }

      // Page context
      if (state.pageContext) {
        pageUrl.textContent = state.pageContext.title || state.pageContext.url;
      }

      // Messages
      renderMessages();

      // Send button
      sendBtn.disabled = !connected || isProcessing || !chatInput.value.trim();
    }

    // ─── Render Messages (incremental — no full rebuilds) ──────────
    const msgElements = new Map(); // messageId → HTMLElement

    /** Find the next DOM element that should come after the given message */
    function findNextSibling(msgId, allMessages) {
      const idx = allMessages.findIndex((m) => m.id === msgId);
      // Look forward in array for an already-rendered element to insert before
      for (let i = idx + 1; i < allMessages.length; i++) {
        const existing = msgElements.get(allMessages[i].id);
        if (existing) return existing;
      }
      return null; // no sibling → appendChild
    }

    function renderMessages() {
      if (!messages.length) {
        messagesEl.innerHTML = "";
        msgElements.clear();
        return;
      }

      let hasNew = false;
      let lastStreamingEl = null;

      for (const msg of messages) {
        let el = msgElements.get(msg.id);

        if (!el) {
          // New message — insert at correct DOM position matching array order
          el = document.createElement("div");
          el.className = `msg ${msg.role}`;
          // Find the next existing sibling in DOM order
          const nextEl = findNextSibling(msg.id, messages);
          messagesEl.insertBefore(el, nextEl);
          msgElements.set(msg.id, el);
          hasNew = true;
        }

        // Update streaming state
        if (msg.isStreaming) {
          el.className = `msg ${msg.role} streaming`;
          // Streaming: use fast simple renderer (handles truncated syntax gracefully)
          el.innerHTML = renderContentSimple(msg.content);
          lastStreamingEl = el;
        } else {
          el.classList.remove("streaming");
          // Completed: use full Markdown renderer once
          if (!el.dataset.rendered) {
            el.innerHTML = renderContentFull(msg.content);
            el.dataset.rendered = "1";
          }
        }
      }

      // Remove stale elements (messages that were removed)
      for (const [id, el] of msgElements) {
        if (!messages.find((m) => m.id === id)) {
          el.remove();
          msgElements.delete(id);
        }
      }

      // Auto scroll
      if (autoScrolling || hasNew || lastStreamingEl) {
        requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      }
    }

    // ─── Streaming renderer (fast, tolerates incomplete Markdown) ──
    function renderContentSimple(text) {
      if (!text) return "";
      let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Code blocks (if complete)
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        return `<pre><code>${escapeHtml(code)}</code></pre>`;
      });

      // Inline code
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");

      // Bold
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

      // Italic
      html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");

      // Lists
      html = html.replace(/^- (.+)$/gm, "<li>$1</li>");
      html = html.replace(/(<li>.*<\/li>\n?)+/g, "<ul>$&</ul>");

      // Simple line breaks
      html = html.replace(/\n\n/g, "</p><p>");
      html = html.replace(/\n/g, "<br>");

      return `<p>${html}</p>`;
    }

    // ─── Full Markdown renderer (used once when streaming finishes) ──
    function renderContentFull(text) {
      if (!text) return "";
      try {
        // Configure marked for safe rendering
        marked.setOptions({
          breaks: true,
          gfm: true,
        });
        return marked.parse(text);
      } catch {
        // Fallback to simple renderer if marked fails
        return renderContentSimple(text);
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ─── Send Message ─────────────────────────────────────────────
    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || !connected || isProcessing) return;

      chatInput.value = "";
      chatInput.style.height = "auto";
      sendBtn.disabled = true;

      await chrome.runtime.sendMessage({ type: "prompt", message: text });
    }

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    chatInput.addEventListener("input", () => {
      // Auto-resize
      chatInput.style.height = "auto";
      chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + "px";
      sendBtn.disabled = !connected || isProcessing || !chatInput.value.trim();
    });

    sendBtn.addEventListener("click", sendMessage);

    // ─── Actions ───────────────────────────────────────────────────
    btnSummarize.addEventListener("click", async () => {
      showSummarizing();
      try {
        await chrome.runtime.sendMessage({ type: "summarize" });
      } catch (err) {
        connBanner.className = "conn-banner disconnected";
        connBanner.textContent = `❌ Error: ${err.message}`;
      }
    });

    btnStop.addEventListener("click", () => {
      chrome.runtime.sendMessage({ type: "abort" }).catch(() => {});
      connBanner.className = "conn-banner connected";
      connBanner.textContent = "⏹ Generation stopped";
    });

    btnDarkMode.addEventListener("click", async () => {
      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
      if (tab?.id) {
        await chrome.tabs.sendMessage(tab.id, {
          type: "execute_tool",
          toolCallId: "sidepanel-dark",
          toolName: "toggle_dark_mode",
          args: {},
        }).catch(() => {});
      }
    });

    btnClear.addEventListener("click", () => {
      if (confirm("Clear all messages?")) {
        chrome.runtime.sendMessage({ type: "clear_messages" }).catch(() => {});
      }
    });

    btnSettings.addEventListener("click", () => {
      chrome.runtime.openOptionsPage();
    });

    connBanner.addEventListener("click", () => {
      if (!connected) {
        chrome.runtime.sendMessage({ type: "reconnect" });
        connBanner.textContent = "🔄 Reconnecting…";
      }
    });

    // Detect scroll
    messagesEl.addEventListener("scroll", () => {
      const threshold = 30;
      autoScrolling = (messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight) < threshold;
    });

    // Focus input
    chatInput.focus();
  </script>
</body>
</html>
